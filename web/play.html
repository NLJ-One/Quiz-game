<!doctype html>
<html lang="fr" data-theme="vert">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/play.css" />
    <link rel="stylesheet" href="/css/game-animations.css" />
    <script type="module" src="/js/play/main.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#064e2b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Partie en cours — Quiz de mariage</title>
  </head>
  <body class="page-play quiz-backdrop">
    <main class="container center-screen">
      <section class="card status-card" aria-live="polite">
        <span class="badge">Salle <span id="play-code" class="play-code">------</span></span>
        <span id="play-avatar" class="play-avatar" aria-hidden="true"></span>
        <span class="loader" aria-hidden="true"></span>
        <h1 id="play-title">En attente du lancement…</h1>
        <p id="play-status" class="status-message">La partie apparaîtra ici dès qu’elle commencera.</p>
        <div class="play-progress">
          <div class="progress" role="progressbar" aria-label="Progression de la partie" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress__bar"></div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
