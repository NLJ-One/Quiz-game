services:
  - type: web
    name: weddingquiz-server
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
